<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor pinuri text — Curiozități & Legende</title>
<link rel="stylesheet" href="../vendor/leaflet/leaflet.css">
<style>
:root {
  --ink: #0f0f0e;
  --muted: #8a8780;
  --line: #d4d1c8;
  --paper: #efeeea;
  --panel: #f7f5ef;
  --accent-trivia: #7c3aed;
  --accent-trivia-deep: #5b21b6;
  --accent-legenda: #d4a017;
  --accent-legenda-deep: #8a5a00;
  --hot: #b34128;
  --ok: #2a8;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow: hidden; height: 100vh; font-family: Inter, system-ui, sans-serif; color: var(--ink); }
.app {
  display: grid;
  grid-template-columns: 340px 1fr 360px;
  height: 100vh;
  background: var(--paper);
}
aside { background: var(--panel); overflow-y: auto; }
aside.sidebar { border-right: 1px solid var(--line); }
aside.editor { border-left: 1px solid var(--line); }

.brand { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.brand .logo-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
.brand h1 { margin: 0; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
.brand .back { margin-left: auto; font-size: 11px; color: var(--muted); text-decoration: none; }
.brand .back:hover { color: var(--ink); }

.kind-tabs { display: grid; grid-template-columns: 1fr 1fr; border-bottom: 1px solid var(--line); }
.kind-tabs a {
  padding: 12px 14px; text-align: center; font-size: 11.5px; letter-spacing: .08em;
  text-transform: uppercase; font-weight: 700; color: var(--muted);
  text-decoration: none; border-bottom: 2px solid transparent;
}
.kind-tabs a.active { color: var(--ink); border-bottom-color: var(--accent); }
.kind-tabs a:hover { background: rgba(0,0,0,.04); }

.toolbar { padding: 14px 20px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; }
.btn {
  padding: 8px 12px; border: 1px solid var(--line);
  background: white; cursor: pointer; font: inherit; font-size: 12.5px;
  color: var(--ink); border-radius: 0; text-align: center;
  font-weight: 600;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: white; border-color: var(--ink); }
.btn.primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
.btn.danger { color: var(--hot); border-color: var(--line); }
.btn.danger:hover { background: var(--hot); color: white; border-color: var(--hot); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }

.list { padding: 6px 0; }
.row {
  padding: 10px 20px; cursor: pointer;
  font-size: 12.5px; line-height: 1.35;
  border-left: 3px solid transparent;
  border-bottom: 1px solid rgba(0,0,0,.04);
}
.row:hover { background: rgba(0,0,0,.04); }
.row.active { background: rgba(124,58,237,.10); border-left-color: var(--accent); font-weight: 600; }
.row .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10.5px; color: var(--muted); }
.row .ttl { color: var(--ink); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .cat { color: var(--muted); font-size: 10.5px; font-weight: 500; margin-top: 4px; letter-spacing: .04em; text-transform: uppercase; }
.row.empty { color: var(--muted); font-style: italic; cursor: default; }
.row.empty:hover { background: transparent; }

#map { width: 100%; height: 100vh; }

aside.editor .form { padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 12px; }
aside.editor h2 {
  font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase;
  font-weight: 800; margin: 0 0 4px; color: var(--ink);
}
aside.editor .empty {
  margin: auto; padding: 30px 20px;
  text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5;
}
.field { display: flex; flex-direction: column; gap: 4px; }
.field label {
  font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase;
  font-weight: 700; color: var(--muted);
}
.field input, .field textarea, .field select {
  font: inherit; font-size: 13px;
  padding: 8px 10px; border: 1px solid var(--line);
  background: white; color: var(--ink); border-radius: 0;
}
.field textarea { font-family: inherit; min-height: 110px; resize: vertical; line-height: 1.45; }
.field input:focus, .field textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.coords-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.actions { display: grid; gap: 6px; margin-top: 6px; padding-top: 12px; border-top: 1px solid var(--line); }
.img-block {
  display: flex; gap: 10px; align-items: flex-start;
  border: 1px dashed var(--line); padding: 8px; background: white;
}
.img-block img {
  width: 96px; height: 64px; object-fit: cover;
  background: var(--paper); border-radius: 2px;
  flex-shrink: 0;
}
.img-block img.is-placeholder { opacity: .85; }
.img-controls { display: flex; flex-direction: column; gap: 4px; font-size: 12px; flex: 1; }
.btn-file {
  display: inline-block; cursor: pointer; text-align: center;
  padding: 6px 10px; border: 1px solid var(--line); background: white;
  font-size: 12px; font-weight: 600;
}
.btn-file:hover { border-color: var(--ink); }
.btn-link {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: var(--muted); text-align: left; font: inherit; font-size: 11.5px;
  text-decoration: underline; text-decoration-color: var(--line);
}
.btn-link:hover { color: var(--hot); text-decoration-color: var(--hot); }
.img-status { font-size: 11px; color: var(--muted); margin-top: 2px; }
.img-status.changed { color: var(--ok); font-weight: 600; }

/* Pinuri (preview pe hartă) — match cu stilul main app */
.trivia-pin {
  width: 22px; height: 22px; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #a78bfa, #7c3aed 55%, #5b21b6 100%);
  border: 2px solid white;
  box-shadow: 0 2px 5px rgba(0,0,0,.45);
  color: white; display: flex; align-items: center; justify-content: center;
  font-size: 13.5px; font-weight: 800; line-height: 1;
  cursor: grab;
}
.trivia-pin.selected { transform: scale(1.3); box-shadow: 0 0 0 4px rgba(124,58,237,.35), 0 4px 10px rgba(0,0,0,.5); }
.legenda-pin {
  width: 26px; height: 26px; border-radius: 50%;
  background: radial-gradient(circle at 32% 28%, #fde68a, #d4a017 50%, #8a5a00 100%);
  border: 2px solid white;
  box-shadow: 0 2px 6px rgba(0,0,0,.5);
  color: #2a1c00; display: flex; align-items: center; justify-content: center;
  cursor: grab;
}
.legenda-pin svg { width: 14px; height: 14px; }
.legenda-pin.selected { transform: scale(1.3); box-shadow: 0 0 0 4px rgba(212,160,23,.4), 0 4px 10px rgba(0,0,0,.5); }
.leaflet-marker-draggable:active .trivia-pin,
.leaflet-marker-draggable:active .legenda-pin { cursor: grabbing; }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--ink); color: white; padding: 10px 18px;
  font-size: 13px; font-weight: 600; letter-spacing: .04em;
  z-index: 99999; opacity: 0; pointer-events: none;
  transition: opacity .2s ease;
}
.toast.show { opacity: 1; }
.toast.ok { background: var(--ok); }
.toast.err { background: var(--hot); }

.help-text {
  padding: 14px 20px; font-size: 11.5px; line-height: 1.5; color: var(--muted);
  border-top: 1px solid var(--line);
}

@media (max-width: 1100px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto 40vh; }
  aside { max-height: 30vh; }
  #map { height: 40vh; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo-dot" id="brand-dot"></span>
      <h1 id="brand-title">Editor pinuri</h1>
      <a class="back" href="../index.html">← Hartă</a>
    </div>
    <div class="kind-tabs">
      <a href="?kind=trivia" id="tab-trivia">Curiozități</a>
      <a href="?kind=legenda" id="tab-legenda">Legende</a>
    </div>
    <div class="toolbar">
      <button class="btn primary" id="btn-new">+ Adaugă nou</button>
      <div style="font-size: 11.5px; color: var(--muted); text-align: center;">
        <span id="stat-total">0</span> înregistrări
      </div>
    </div>
    <div class="list" id="list"></div>
  </aside>

  <main>
    <div id="map"></div>
  </main>

  <aside class="editor">
    <div class="empty" id="form-empty">
      <p style="font-weight: 600; margin: 0 0 8px; color: var(--ink); font-size: 14px;">Niciun element selectat</p>
      <p>Click pe un rând din listă sau pe „+ Adaugă nou".</p>
      <p style="margin-top: 14px; font-size: 11.5px; opacity: .8;">Trage pinul pe hartă pentru a-i schimba poziția.</p>
    </div>
    <form class="form" id="form" style="display: none;">
      <h2 id="form-title">Editează</h2>
      <div class="field">
        <label for="f-title">Titlu (RO) *</label>
        <input type="text" id="f-title" name="title" required>
      </div>
      <div class="field">
        <label for="f-title-en">Titlu (EN)</label>
        <input type="text" id="f-title-en" name="title_en">
      </div>
      <div class="field">
        <label for="f-meta">Meta RO (data/atribuire scurtă)</label>
        <input type="text" id="f-meta" name="meta" placeholder="ex: 1445 — uricul lui Ștefan Vodă">
      </div>
      <div class="field">
        <label for="f-meta-en">Meta EN</label>
        <input type="text" id="f-meta-en" name="meta_en">
      </div>
      <div class="field">
        <label for="f-year">An (pentru filtrul timeline)</label>
        <input type="number" id="f-year" name="year" min="100" max="2100" step="1" placeholder="ex: 1445">
      </div>
      <div class="field">
        <label for="f-category">Categorie RO</label>
        <input type="text" id="f-category" name="category" placeholder="ex: Vechime · Atestare">
      </div>
      <div class="field">
        <label for="f-category-en">Categorie EN</label>
        <input type="text" id="f-category-en" name="category_en">
      </div>
      <div class="field">
        <label for="f-description">Descriere RO</label>
        <textarea id="f-description" name="description" rows="6"></textarea>
      </div>
      <div class="field">
        <label for="f-description-en">Descriere EN</label>
        <textarea id="f-description-en" name="description_en" rows="6"></textarea>
      </div>
      <div class="field">
        <label>Imagine</label>
        <div class="img-block">
          <img id="f-img-preview" alt="" src="">
          <div class="img-controls">
            <label class="btn btn-file" for="f-image">Înlocuiește…</label>
            <input type="file" id="f-image" name="image" accept="image/*" hidden>
            <button type="button" class="btn-link" id="btn-remove-img">Folosește placeholder</button>
          </div>
        </div>
        <input type="hidden" id="f-remove-image" name="remove_image" value="">
      </div>
      <div class="coords-row">
        <div class="field">
          <label for="f-lat">Lat</label>
          <input type="number" id="f-lat" name="lat" step="0.000001" required>
        </div>
        <div class="field">
          <label for="f-lon">Lon</label>
          <input type="number" id="f-lon" name="lon" step="0.000001" required>
        </div>
      </div>
      <input type="hidden" id="f-id" name="id">
      <div class="actions">
        <button type="submit" class="btn primary" id="btn-save">Salvează</button>
        <button type="button" class="btn danger" id="btn-delete" style="display:none;">Șterge</button>
      </div>
    </form>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script src="../vendor/leaflet/leaflet.js"></script>
<script>
const params = new URLSearchParams(location.search);
const kind = (params.get('kind') === 'legenda') ? 'legenda' : 'trivia';
const isTrivia = kind === 'trivia';

const config = {
  trivia: {
    name: 'Curiozități',
    json: '../trivia.json',
    api: { add: '/api/add-trivia', update: '/api/update-trivia', delete: '/api/delete-trivia' },
    accent: '#7c3aed',
    placeholder: '../../assets/images/placeholder-trivia.svg',
  },
  legenda: {
    name: 'Legende',
    json: '../legende.json',
    api: { add: '/api/add-legenda', update: '/api/update-legenda', delete: '/api/delete-legenda' },
    accent: '#d4a017',
    placeholder: '../../assets/images/placeholder-legenda.svg',
  },
}[kind];

// Header
document.title = `Editor ${config.name}`;
document.getElementById('brand-title').textContent = `Editor ${config.name.toLowerCase()}`;
document.getElementById('brand-dot').style.background = config.accent;
document.getElementById('tab-' + kind).classList.add('active');
document.documentElement.style.setProperty('--accent', config.accent);
document.documentElement.style.setProperty('--accent-deep', isTrivia ? '#5b21b6' : '#8a5a00');

// Map
const map = L.map('map', { zoomControl: true }).setView([45.4353, 28.0556], 14);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  maxZoom: 19, attribution: '© OpenStreetMap, © CARTO',
}).addTo(map);

const LEGENDA_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4a2 2 0 0 1 2-2h9l3 3v15a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z"/><path d="M14 2v4h4"/><path d="M9 11h6M9 15h6M9 7h2"/></svg>';

function makeIcon(selected) {
  if (isTrivia) {
    return L.divIcon({
      className: 'custom-marker',
      html: `<div class="trivia-pin${selected ? ' selected' : ''}">?</div>`,
      iconSize: [22, 22], iconAnchor: [11, 11],
    });
  }
  return L.divIcon({
    className: 'custom-marker',
    html: `<div class="legenda-pin${selected ? ' selected' : ''}">${LEGENDA_SVG}</div>`,
    iconSize: [26, 26], iconAnchor: [13, 13],
  });
}

let items = [];
let markers = {}; // id → L.marker
let currentId = null;

const $list = document.getElementById('list');
const $form = document.getElementById('form');
const $formEmpty = document.getElementById('form-empty');
const $statTotal = document.getElementById('stat-total');
const $formTitle = document.getElementById('form-title');
const $fId = document.getElementById('f-id');
const $fTitle = document.getElementById('f-title');
const $fTitleEn = document.getElementById('f-title-en');
const $fMeta = document.getElementById('f-meta');
const $fMetaEn = document.getElementById('f-meta-en');
const $fYear = document.getElementById('f-year');
const $fCategory = document.getElementById('f-category');
const $fCategoryEn = document.getElementById('f-category-en');
const $fDescription = document.getElementById('f-description');
const $fDescriptionEn = document.getElementById('f-description-en');
const $fLat = document.getElementById('f-lat');
const $fLon = document.getElementById('f-lon');
const $fImage = document.getElementById('f-image');
const $fImgPreview = document.getElementById('f-img-preview');
const $fRemoveImage = document.getElementById('f-remove-image');
const $btnRemoveImg = document.getElementById('btn-remove-img');
const $btnDelete = document.getElementById('btn-delete');
const $toast = document.getElementById('toast');

// Image preview state for the form. Resolves entry paths (relative to galati_map/)
// to URLs the admin page can load (admin is one level deeper).
function entryImageUrl(rawPath) {
  if (!rawPath) return '';
  // entries store paths like "../assets/images/local/xxx" — relative to /galati_map/.
  // From /galati_map/_admin/ we need one extra "../".
  if (rawPath.startsWith('../')) return '../' + rawPath;
  return rawPath;
}
function setFormImage(entryPath) {
  const url = entryPath ? entryImageUrl(entryPath) : config.placeholder;
  $fImgPreview.src = url;
  $fImgPreview.classList.toggle('is-placeholder', !entryPath);
}

function toast(msg, type = '') {
  $toast.textContent = msg;
  $toast.className = 'toast show ' + type;
  setTimeout(() => $toast.classList.remove('show'), 2200);
}

function renderList() {
  $statTotal.textContent = items.length;
  if (!items.length) {
    $list.innerHTML = '<div class="row empty">Niciun element. Click pe „+ Adaugă nou".</div>';
    return;
  }
  $list.innerHTML = items.map(it => `
    <div class="row${it.id === currentId ? ' active' : ''}" data-id="${it.id}">
      <div class="id">${it.id}</div>
      <div class="ttl">${escapeHtml(it.title || '(fără titlu)')}</div>
      <div class="cat">${escapeHtml(it.category || '')}</div>
    </div>
  `).join('');
  $list.querySelectorAll('.row[data-id]').forEach(el => {
    el.addEventListener('click', () => selectItem(el.dataset.id));
  });
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderMarkers() {
  Object.values(markers).forEach(m => map.removeLayer(m));
  markers = {};
  items.forEach(it => {
    if (typeof it.lat !== 'number' || typeof it.lon !== 'number') return;
    const m = L.marker([it.lat, it.lon], {
      icon: makeIcon(it.id === currentId),
      draggable: true,
    });
    m.on('click', () => selectItem(it.id));
    m.on('dragend', () => {
      const ll = m.getLatLng();
      it.lat = ll.lat; it.lon = ll.lng;
      if (it.id === currentId) {
        $fLat.value = ll.lat.toFixed(6);
        $fLon.value = ll.lng.toFixed(6);
      }
    });
    m.addTo(map);
    markers[it.id] = m;
  });
}

function selectItem(id) {
  currentId = id;
  const it = items.find(x => x.id === id);
  if (!it) return;
  $formEmpty.style.display = 'none';
  $form.style.display = 'flex';
  $formTitle.textContent = `Editează ${id}`;
  $fId.value = id;
  $fTitle.value = it.title || '';
  $fTitleEn.value = it.title_en || '';
  $fMeta.value = it.meta || '';
  $fMetaEn.value = it.meta_en || '';
  $fYear.value = (it.year !== null && it.year !== undefined) ? it.year : '';
  $fCategory.value = it.category || '';
  $fCategoryEn.value = it.category_en || '';
  $fDescription.value = it.description || '';
  $fDescriptionEn.value = it.description_en || '';
  $fLat.value = (it.lat || 0).toFixed(6);
  $fLon.value = (it.lon || 0).toFixed(6);
  setFormImage(it.image || '');
  $fImage.value = '';
  $fRemoveImage.value = '';
  $btnDelete.style.display = 'block';
  renderList();
  // Refresh markers to update selected state
  Object.entries(markers).forEach(([mid, m]) => {
    m.setIcon(makeIcon(mid === id));
  });
  // Center map on selected
  if (typeof it.lat === 'number' && typeof it.lon === 'number') {
    map.setView([it.lat, it.lon], Math.max(map.getZoom(), 16), { animate: true });
  }
}

function clearForm() {
  currentId = null;
  $formEmpty.style.display = 'flex';
  $form.style.display = 'none';
  renderList();
  Object.entries(markers).forEach(([mid, m]) => m.setIcon(makeIcon(false)));
}

document.getElementById('btn-new').addEventListener('click', () => {
  currentId = null;
  $formEmpty.style.display = 'none';
  $form.style.display = 'flex';
  $formTitle.textContent = `Adaugă ${isTrivia ? 'curiozitate' : 'legendă'} nouă`;
  $fId.value = '';
  $fTitle.value = '';
  $fTitleEn.value = '';
  $fMeta.value = '';
  $fMetaEn.value = '';
  $fYear.value = '';
  $fCategory.value = isTrivia ? 'Știați că?' : 'Legendă';
  $fCategoryEn.value = isTrivia ? 'Did you know?' : 'Legend';
  $fDescription.value = '';
  $fDescriptionEn.value = '';
  const c = map.getCenter();
  $fLat.value = c.lat.toFixed(6);
  $fLon.value = c.lng.toFixed(6);
  setFormImage('');
  $fImage.value = '';
  $fRemoveImage.value = '';
  $btnDelete.style.display = 'none';
  $fTitle.focus();
});

// Preview new uploaded image immediately (before submit)
$fImage.addEventListener('change', () => {
  const f = $fImage.files && $fImage.files[0];
  if (!f) return;
  const url = URL.createObjectURL(f);
  $fImgPreview.src = url;
  $fImgPreview.classList.remove('is-placeholder');
  // Selecting a new file cancels any pending "remove" flag
  $fRemoveImage.value = '';
});
$btnRemoveImg.addEventListener('click', () => {
  $fImage.value = '';
  $fRemoveImage.value = '1';
  $fImgPreview.src = config.placeholder;
  $fImgPreview.classList.add('is-placeholder');
});

$form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const isNew = !$fId.value;
  const url = isNew ? config.api.add : config.api.update;
  const fd = new FormData();
  if (!isNew) fd.append('id', $fId.value);
  fd.append('title', $fTitle.value.trim());
  fd.append('title_en', $fTitleEn.value.trim());
  fd.append('meta', $fMeta.value.trim());
  fd.append('meta_en', $fMetaEn.value.trim());
  fd.append('year', $fYear.value.trim());
  fd.append('category', $fCategory.value.trim());
  fd.append('category_en', $fCategoryEn.value.trim());
  fd.append('description', $fDescription.value.trim());
  fd.append('description_en', $fDescriptionEn.value.trim());
  fd.append('lat', $fLat.value);
  fd.append('lon', $fLon.value);
  if ($fImage.files && $fImage.files[0]) fd.append('image', $fImage.files[0]);
  if ($fRemoveImage.value === '1') fd.append('remove_image', '1');
  try {
    const r = await fetch(url, { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || 'Eroare');
    toast(isNew ? 'Adăugat' : 'Salvat', 'ok');
    await loadItems();
    selectItem(data.entry.id);
  } catch (err) {
    toast('Eroare: ' + err.message, 'err');
  }
});

$btnDelete.addEventListener('click', async () => {
  if (!$fId.value) return;
  if (!confirm(`Ștergi ${$fId.value}?`)) return;
  const fd = new FormData();
  fd.append('id', $fId.value);
  try {
    const r = await fetch(config.api.delete, { method: 'POST', body: fd });
    const data = await r.json();
    if (!r.ok || !data.ok) throw new Error(data.error || 'Eroare');
    toast('Șters', 'ok');
    await loadItems();
    clearForm();
  } catch (err) {
    toast('Eroare: ' + err.message, 'err');
  }
});

async function loadItems() {
  try {
    const r = await fetch(config.json + '?t=' + Date.now());
    items = await r.json();
    renderList();
    renderMarkers();
  } catch (e) {
    toast('Nu pot încărca: ' + e.message, 'err');
  }
}

// Deep-link: ?edit=<id> auto-selects that entry after load (used by the
// „✎ Editează" button in the main app's text modal).
function applyDeepLinkSelect() {
  const editId = params.get('edit');
  if (!editId) return;
  if (items.find(x => x.id === editId)) selectItem(editId);
  else toast(`Item ${editId} negăsit`, 'err');
}

// Auto-save coords when user types them (so drag isn't the only way)
[$fLat, $fLon].forEach(inp => {
  inp.addEventListener('change', () => {
    if (!currentId) return;
    const it = items.find(x => x.id === currentId);
    if (!it) return;
    const lat = parseFloat($fLat.value), lon = parseFloat($fLon.value);
    if (Number.isFinite(lat) && Number.isFinite(lon)) {
      it.lat = lat; it.lon = lon;
      const m = markers[currentId];
      if (m) m.setLatLng([lat, lon]);
    }
  });
});

loadItems().then(applyDeepLinkSelect);
</script>
</body>
</html>
