name: Deploy to ionpeblog.ro

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_slate:
        description: 'Wipe server folders before upload (orphan cleanup — use sparingly)'
        type: boolean
        default: false

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Gate înainte de deploy: smoke test Playwright pe site-ul static.
  # Dacă harta nu se încarcă / timeline-ul nu filtrează / detaliul nu se
  # deschide, nu livrăm nimic. Testele: tests/smoke.spec.js.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install test dependencies
        run: npm ci

      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate JSON data files
        run: python3 scripts/validate_data.py

      - name: Generate SEO static pages
        env:
          # Configurable via GitHub Actions variables (Settings → Variables → Actions).
          # Set HG_BASE_URL if/when the site moves to a different host.
          HG_BASE_URL: ${{ vars.HG_BASE_URL || 'https://ionpeblog.ro' }}
        run: python3 scripts/generate_static_pages.py

      - name: Bump service-worker cache version
        # Appends the short commit SHA so the version is unique per-commit.
        # Required because CI doesn't commit the bump back to git — without a SHA
        # suffix, repeated pushes without local bumps would re-use the same version
        # and browser caches would never refresh.
        run: |
          python3 - <<'PY'
          import os, re, pathlib, sys
          sw = pathlib.Path('galati_map/sw.js')
          c = sw.read_text(encoding='utf-8')
          sha = (os.environ.get('GITHUB_SHA') or 'local')[:7]
          m = re.search(r"const CACHE_VERSION = '(tg-v\d+)'", c)
          if not m:
              # Fail loudly: dacă pattern-ul dispare, deploy-ul ar livra cod nou
              # cu versiune de cache veche → utilizatorii recurenți ar rămâne
              # blocați pe versiunea precedentă fără niciun semnal.
              print("  ✗ CACHE_VERSION pattern not found in sw.js — refusing to deploy stale cache version")
              sys.exit(1)
          base = m.group(1)
          new = f"{base}-{sha}"
          sw.write_text(c.replace(f"'{base}'", f"'{new}'", 1), encoding='utf-8')
          print(f"  ✓ SW cache: {base} → {new}")
          PY

      - name: Bundle CSS (flatten @imports)
        # Înlocuiește @import-urile din main.css/lists.css/maps.css cu conținutul
        # efectiv → un singur fișier CSS per pagină (un round-trip mai puțin +
        # 12 cereri eliminate la primul load). Ca bump-ul SW, mutația rămâne în
        # workspace-ul CI; repo-ul păstrează manifestul cu @import pentru dev.
        # --minify: scoate comentariile + indentarea (conservator, conștient de
        # string-uri). Verificat pixel-cu-pixel identic pe index/lists/maps.
        # main.css: 33,3 KB → 20,8 KB gzip. Scriptul EȘUEAZĂ acum dacă rămâne
        # vreun @import nerezolvat, în loc să livreze tăcut CSS incomplet.
        run: python3 scripts/build_css.py --write --minify

      - name: Deploy galati_map/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./galati_map/
          server-dir: ${{ vars.FTP_TARGET_GALATI_MAP || './galati_map/' }}
          log-level: standard
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_slate || false }}
          exclude: |
            **/.git*
            **/.git*/**
            **/__pycache__/**
            **/.DS_Store
            **/_admin/**
            **/geocode_cache.json
            **/manual_overrides.json
            **/unplaced_locations.json
            **/*.pyc
            **/*.pyo
            **/*.swp
            **/*.log

      - name: Generate WebP for any new images
        # Variantele .webp ale imaginilor existente sunt comise în repo. Acest pas
        # completează DOAR imaginile noi (--skip-existing → determinist, nu atinge
        # cele existente), ca o poză adăugată recent să fie servită optimizat.
        # Non-fatal: un hiccup la pip nu trebuie să blocheze deploy-ul.
        continue-on-error: true
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/optimize_images.py --skip-existing

      - name: Generate 480px thumbnails for any new images
        # Miniaturile (assets/thumbs/) sunt comise în repo; acest pas completează
        # doar imaginile noi, la fel ca pasul WebP de mai sus. --skip-existing e
        # determinist (mtime-ul de la checkout git nu e de încredere).
        # Non-fatal: JS-ul are fallback pe original dacă miniatura lipsește.
        continue-on-error: true
        run: python3 scripts/build_thumbnails.py --skip-existing

      - name: Deploy assets/ via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || 21 }}
          local-dir: ./assets/
          server-dir: ${{ vars.FTP_TARGET_ASSETS || './assets/' }}
          log-level: standard
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_slate || false }}
          exclude: |
            **/.git*
            **/.git*/**
            **/__pycache__/**
            **/.DS_Store
            **/*.pyc
            **/*.swp
            **/battle/**
